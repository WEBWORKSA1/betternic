name: Daily update & build

on:
  schedule:
    - cron: "17 6 * * *"   # every day 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "bootstrap.json"
      - "src/**"
      - "scripts/**"
      - "assets/**"
      - "data/listings.json"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One-time housekeeping: optional source bundle (SHA-256 verified) and removal of retired files listed in bootstrap.json.
      - name: Bootstrap source bundle
        if: hashFiles('bootstrap.json') != ''
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, shutil, urllib.request, zipfile
          cfg = json.load(open("bootstrap.json"))
          data = None
          for url in cfg.get("urls", []):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = urllib.request.urlopen(req, timeout=120).read()
                  if hashlib.sha256(data).hexdigest() == cfg["sha256"]:
                      print("downloaded", url, len(data)); break
                  print("hash mismatch from", url); data = None
              except Exception as ex:
                  print("failed", url, ex)
          if cfg.get("urls") and not data:
              raise SystemExit("bootstrap bundle not available or hash mismatch")
          z = zipfile.ZipFile(io.BytesIO(data)) if data else None
          for n in (z.namelist() if z else []):
              if n.startswith(".github/") or ".." in n or n.startswith("/"):
                  continue
              if n.endswith("/"):
                  os.makedirs(n, exist_ok=True); continue
              os.makedirs(os.path.dirname(n) or ".", exist_ok=True)
              open(n, "wb").write(z.read(n))
          for old in cfg.get("delete", []):
              if os.path.isdir(old): shutil.rmtree(old)
              elif os.path.exists(old): os.remove(old)
          os.remove("bootstrap.json")
          print("bootstrap complete")
          PY

      - name: Install optional packages
        run: pip install --quiet wordfreq pillow || true

      - name: Render brand images (only if missing)
        run: python3 scripts/make_images.py || true

      - name: Fetch daily data
        run: python3 scripts/update_data.py

      - name: Build site
        run: python3 scripts/build.py

      - name: Commit and push
        run: |
          git config user.name "betternic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
