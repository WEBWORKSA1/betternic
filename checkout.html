<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout · BetterNic</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles/main.css">
<link rel="stylesheet" href="/styles/checkout.css">
</head>
<body>

<header class="site-header">
  <a href="/" class="logo-lockup">
    <svg width="32" height="32" viewBox="0 0 80 80"><rect width="80" height="80" rx="16" fill="currentColor"/><path d="M26 22 L26 58 M26 22 L46 22 C53 22 56 26 56 31 C56 36 53 39 47 39 L26 39 M26 39 L48 39 C55 39 58 43 58 49 C58 54 55 58 47 58 L26 58" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="wordmark">BetterNic</span>
  </a>
  <div class="checkout-trust">
    <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4 7 L6 9 L10 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>Secure checkout</span>
  </div>
</header>

<main class="checkout-page">
  <h1 class="checkout-title">Checkout · <span id="co-domain">loading...</span></h1>

  <div class="checkout-grid">
    <div class="checkout-left">
      <h2 class="checkout-section-h">Choose your payment method</h2>

      <label class="payment-option selected" data-method="stripe">
        <input type="radio" name="payment" value="stripe" checked hidden>
        <div class="po-content">
          <div class="po-title">Stripe · Card or bank wire</div>
          <div class="po-desc">Recommended for transactions under $5,000 · 2.9% + $0.30</div>
        </div>
        <div class="po-check"></div>
      </label>

      <label class="payment-option" data-method="escrow">
        <input type="radio" name="payment" value="escrow" hidden>
        <div class="po-content">
          <div class="po-title">Escrow.com</div>
          <div class="po-desc">Industry-standard escrow for large deals · 3.25%</div>
        </div>
        <div class="po-check"></div>
      </label>

      <label class="payment-option" data-method="wire">
        <input type="radio" name="payment" value="wire" hidden>
        <div class="po-content">
          <div class="po-title">Wire transfer</div>
          <div class="po-desc">For deals over $25,000 · Manual processing within 24h</div>
        </div>
        <div class="po-check"></div>
      </label>

      <h2 class="checkout-section-h" id="lto-section-title" style="display:none;">Or pay over time</h2>

      <div id="lto-options"></div>

      <div class="contact-block">
        <h3 class="checkout-section-h">Your details</h3>
        <div class="form-row">
          <label>Email</label>
          <input type="email" id="buyer-email" class="form-input" required placeholder="you@company.com">
        </div>
        <div class="form-row">
          <label>Full name</label>
          <input type="text" id="buyer-name" class="form-input" required placeholder="Your full legal name">
        </div>
      </div>
    </div>

    <aside class="checkout-summary">
      <h3 class="summary-title">Order summary</h3>
      <div class="summary-row"><span>Domain</span><span id="s-domain">—</span></div>
      <div class="summary-row"><span>Price</span><span id="s-price">$0</span></div>
      <div class="summary-row"><span>Processing</span><span id="s-fee">$0</span></div>
      <div class="summary-divider"></div>
      <div class="summary-total"><span>Total</span><span id="s-total">$0</span></div>
      <button onclick="completePurchase()" class="btn btn-primary" style="width:100%;margin-top:1rem;">Complete purchase</button>
      <div class="summary-fineprint">Secure transfer in 24-72h after payment clears. Money-back guarantee if transfer fails.</div>
    </aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lib/config.js"></script>
<script src="/lib/api.js"></script>
<script src="/lib/checkout.js"></script>
</body>
</html>
