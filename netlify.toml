# BetterNic — Netlify config. Every deploy runs scripts/deploy_build.py (fresh data + full build into /public).
# The daily GitHub Action (.github/workflows/daily.yml) refreshes data, commits it, and that commit triggers a new deploy.
[build]
  publish = "public"
  command = "python3 scripts/deploy_build.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Old v1/v2 URLs
[[redirects]]
  from = "/browse.html"
  to = "/marketplace.html"
  status = 301
