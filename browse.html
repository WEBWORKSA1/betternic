<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse domains · BetterNic</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles/main.css">
<link rel="stylesheet" href="/styles/browse.css">
</head>
<body>

<header class="site-header">
  <a href="/" class="logo-lockup">
    <svg width="32" height="32" viewBox="0 0 80 80"><rect width="80" height="80" rx="16" fill="currentColor"/><path d="M26 22 L26 58 M26 22 L46 22 C53 22 56 26 56 31 C56 36 53 39 47 39 L26 39 M26 39 L48 39 C55 39 58 43 58 49 C58 54 55 58 47 58 L26 58" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="wordmark">BetterNic</span>
  </a>
  <nav class="nav-links">
    <a href="/browse.html" class="active">Browse</a>
    <a href="/sell.html">Sell</a>
    <a href="/lease.html">Lease</a>
    <a href="/pricing.html">Pricing</a>
  </nav>
  <div class="header-cta">
    <a href="/login.html" class="btn btn-secondary">Sign in</a>
    <a href="/dashboard.html" class="btn btn-primary">List a domain</a>
  </div>
</header>

<main class="browse-page">
  <div class="browse-header">
    <h1>Browse domains</h1>
    <form class="search-box" onsubmit="handleSearch(event)">
      <input type="text" id="browse-search" placeholder="Search by keyword, e.g. crypto, ai" value="">
      <button type="submit" class="btn btn-primary">Search</button>
    </form>
  </div>

  <div class="browse-layout">
    <aside class="browse-filters">
      <h3>Filters</h3>
      <div class="filter-group">
        <h4>Price range</h4>
        <label><input type="checkbox" data-filter="price" value="0-1000"> Under $1,000</label>
        <label><input type="checkbox" data-filter="price" value="1000-5000"> $1,000 - $5,000</label>
        <label><input type="checkbox" data-filter="price" value="5000-25000"> $5,000 - $25,000</label>
        <label><input type="checkbox" data-filter="price" value="25000-100000"> $25,000 - $100,000</label>
        <label><input type="checkbox" data-filter="price" value="100000+"> $100,000+</label>
      </div>
      <div class="filter-group">
        <h4>Extension</h4>
        <label><input type="checkbox" data-filter="tld" value=".com"> .com</label>
        <label><input type="checkbox" data-filter="tld" value=".io"> .io</label>
        <label><input type="checkbox" data-filter="tld" value=".ai"> .ai</label>
        <label><input type="checkbox" data-filter="tld" value=".co"> .co</label>
        <label><input type="checkbox" data-filter="tld" value=".net"> .net</label>
      </div>
      <div class="filter-group">
        <h4>Sale type</h4>
        <label><input type="checkbox" data-filter="type" value="bin"> Buy it now</label>
        <label><input type="checkbox" data-filter="type" value="lto"> Lease to own</label>
        <label><input type="checkbox" data-filter="type" value="offer"> Make offer</label>
      </div>
      <div class="filter-group">
        <h4>Category</h4>
        <label><input type="checkbox" data-filter="cat" value="finance"> Finance</label>
        <label><input type="checkbox" data-filter="cat" value="ai"> AI</label>
        <label><input type="checkbox" data-filter="cat" value="crypto"> Crypto</label>
        <label><input type="checkbox" data-filter="cat" value="brandable"> Brandable</label>
      </div>
    </aside>

    <div class="browse-results">
      <div class="results-toolbar">
        <span class="results-count" id="results-count">Loading...</span>
        <select class="form-input" id="sort-select" style="max-width:180px;">
          <option value="newest">Newest first</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
          <option value="length">Shortest first</option>
        </select>
      </div>
      <div class="domain-grid-large" id="results-grid">
        <!-- populated by JS -->
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lib/config.js"></script>
<script src="/lib/api.js"></script>
<script src="/lib/browse.js"></script>
</body>
</html>
